# P7 auto-release: tag v* push → builds + uploads to release
# Distinguishes between pre-release (vX.Y.Z-prerelease*) and official releases
# Prerelease tags are marked as pre-release in GitHub Releases
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            suffix: x86_64-unknown-linux-gnu
          - target: x86_64-unknown-linux-musl
            suffix: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - run: rustup target add ${{ matrix.target }}
      - name: build
        run: |
          cargo build --release --target ${{ matrix.target }}
          VER=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].version')
          [ -n "$VER" ] && [ "$VER" != null ]
          cp "target/${{ matrix.target }}/release/my2sql-rs" \
             "my2sql-rs-${VER}-${{ matrix.suffix }}"
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          # Check if tag contains prerelease identifiers
          IS_PRERELEASE="false"
          if [[ "$TAG" =~ -(alpha|beta|rc|pre) ]]; then
            IS_PRERELEASE="--prerelease"
          fi
          # Create release with appropriate flag
          gh release create "${TAG}" \
            --title "Release ${TAG}" \
            $IS_PRERELEASE \
            --notes "Automated release from tag push: ${TAG}"
          # Upload artifacts
          gh release upload "${TAG}" \
            "my2sql-rs-"*-${{ matrix.suffix }} --clobber
  sha:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release download "$GITHUB_REF_NAME" -p 'my2sql-rs-*' -D /tmp/rel
          ( cd /tmp/rel && sha256sum my2sql-rs-* > SHA256SUMS )
          gh release upload "$GITHUB_REF_NAME" /tmp/rel/SHA256SUMS --clobber
