[package]
name = "my2sql-rs"
version = "0.5.2-p7"
edition = "2024"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
crc32fast = "1.5.2"
crossbeam-channel = "0.5.17"
ctrlc = "3"
mimalloc = "0.1.52"
mysql = { version = "28.0.2", features = ["binlog"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
simdutf8 = "0.1.5"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[profile.release]
lto = true

# bench 与 release 同编译档（lto=true），吞吐基线必须是发布态
[profile.bench]
inherits = "release"

[[bench]]
name = "decode"
path = "benches/decode.rs"
harness = false

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.11.0"

# P4a Lane A：fuzz/ 为独立 cargo-fuzz workspace（根构建/三门/矩阵零感知）。
[workspace]
members = ["."]
exclude = ["fuzz"]
