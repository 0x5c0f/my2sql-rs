[package]
name = "my2sql-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
crc32fast = "1.5.2"
crossbeam-channel = "0.5.17"
mysql = "28.0.2"
mysql_common = "0.38.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
simdutf8 = "0.1.5"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[profile.release]
lto = true
